<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | POP!Work</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* --- MOUNT KINABALU BACKGROUND --- */
    .bg-fixed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('uploads/photos/Mount Kinabalu.jpg');
      background-size: cover;
      background-position: center;
      z-index: -2;
      filter: brightness(0.4) contrast(1.1);
    }

    /* Login Container */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      z-index: 10;
    }

    /* Animated Background Circles */
    .login-container::before,
    .login-container::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(138, 21, 56, 0.15) 0%, transparent 70%);
      animation: float 20s ease-in-out infinite;
      z-index: 1;
    }

    .login-container::before {
      width: 400px;
      height: 400px;
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }

    .login-container::after {
      width: 300px;
      height: 300px;
      bottom: -50px;
      right: -50px;
      animation-delay: 5s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -50px) rotate(120deg); }
      66% { transform: translate(-20px, 20px) rotate(240deg); }
    }

    /* Login Card */
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 50px 40px;
      width: 100%;
      max-width: 450px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      position: relative;
      z-index: 10;
      animation: floatUp 0.6s ease-out;
    }

    @keyframes floatUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .card-header h2 {
      font-size: 32px;
      font-weight: 800;
      color: #2d3436;
      margin-bottom: 8px;
    }

    .card-header p {
      color: #636e72;
      font-size: 14px;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #2d3436;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .input-wrapper {
      position: relative;
    }
    
    .form-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 2px solid #dfe6e9;
      background: #f8f9fa;
      color: #2d3436;
      font-size: 15px;
      font-family: 'Poppins', sans-serif;
      transition: all 0.3s ease;
    }

    .form-input::placeholder {
      color: #b2bec3;
    }

    .form-input:focus {
      outline: none;
      border-color: #8a1538;
      background: white;
      box-shadow: 0 0 0 4px rgba(138, 21, 56, 0.1);
    }
    
    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #95a5a6;
      font-size: 18px;
      user-select: none;
      transition: color 0.3s;
    }

    .password-toggle:hover {
      color: #2d3436;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #8a1538 0%, #c91f4d 100%);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(138, 21, 56, 0.35);
    }
    
    .submit-btn.loading {
      color: transparent;
      pointer-events: none;
    }

    .submit-btn.loading::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin: -10px 0 0 -10px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s infinite linear;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .card-footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid #f0f0f0;
      font-size: 14px;
      color: #636e72;
    }

    .card-footer a {
      color: #8a1538;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .card-footer a:hover {
      color: #c91f4d;
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      z-index: 10;
      position: relative;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .login-card {
        padding: 40px 30px;
        margin: 20px;
      }

      .card-header h2 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

  <!-- Mount Kinabalu Background -->
  <div class="bg-fixed"></div>

  <!-- Header -->
  <header class="pw-header" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);">
    <div class="pw-nav-container">
      <a href="index.php" class="pw-logo">
        <img src="assets/images/logo.png" alt="POP!Work Logo" height="40">
        <span class="logo-text">POP!Work</span>
      </a>

      <nav class="pw-nav">
        <a href="index.php" class="pw-link">Home</a>
        <a href="jobs.php" class="pw-link">Find Jobs</a>
        <a href="about.php" class="pw-link">About Us</a>
      </nav>

      <div class="pw-auth">
        <a href="register.html" class="pw-btn pw-register">Sign Up</a>
      </div>

      <div class="pw-mobile-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <!-- Login Container -->
  <div class="login-container">
    <div class="login-card">
      <div class="card-header">
        <h2>Welcome to POP!Work!</h2>
        <p>Login to access your dashboard</p>
      </div>

      <form id="loginForm" action="backend/login.php" method="POST">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrapper">
            <input type="email" class="form-input" name="email" placeholder="e.g. name@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" class="form-input" name="password" id="password" placeholder="Enter your password" required>
            <span class="password-toggle" onclick="togglePassword()">👁️</span>
          </div>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
      </form>

      <div class="card-footer">
        Don't have an account? <a href="register.html">Sign up for free</a>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 POP!Work | Designed by NUR RASHIDAH BINTI ALIAS</p>
  </footer>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggle = document.querySelector('.password-toggle');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggle.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        toggle.textContent = '👁️';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      const submitBtn = this.querySelector('.submit-btn');
      submitBtn.classList.add('loading');
      submitBtn.textContent = '';
    });

    const inputs = document.querySelectorAll('.form-input');
    inputs.forEach(input => {
      input.addEventListener('focus', function() {
        this.parentElement.classList.add('focused');
      });
      input.addEventListener('blur', function() {
        this.parentElement.classList.remove('focused');
      });
    });

    let formSubmitted = false;
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      if (formSubmitted) {
        e.preventDefault();
        return false;
      }
      formSubmitted = true;
    });

    // Mobile menu toggle
    const toggle = document.querySelector('.pw-mobile-toggle');
    const nav = document.querySelector('.pw-nav');
    if (toggle && nav) {
      toggle.addEventListener('click', () => {
        nav.classList.toggle('active');
        toggle.classList.toggle('active');
      });
    }
  </script>
</body>
</html>
