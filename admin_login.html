<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid #d9534f;
        }
        .login-container h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-submit:hover {
            background-color: #c9302c;
        }
        /* Error Message Styling */
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none; /* Hidden by default */
            font-size: 14px;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Admin Portal</h2>
        
        <div id="error-box" class="error-message"></div>

        <form action="backend/login.php" method="POST">
            <input type="hidden" name="admin_portal" value="1">

            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" name="email" required placeholder="admin@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn-submit">Login to Dashboard</button>
        </form>

        <a href="login.html" class="back-link">← Back to Main Login</a>
    </div>

    <script>
        // Check URL parameters when page loads
        const urlParams = new URLSearchParams(window.location.search);
        const errorBox = document.getElementById('error-box');

        if (urlParams.has('error')) {
            const errorType = urlParams.get('error');

            if (errorType === 'access_denied') {
                errorBox.textContent = "⚠️ Access Denied: You do not have admin privileges.";
                errorBox.style.display = 'block';
            }
        }
    </script>

</body>
</html>
